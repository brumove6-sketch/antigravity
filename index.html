<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup d'main | Plateforme de Mise en Relation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { navy: { 800: '#0B132B', 900: '#050914' }, energy: '#FACC15' } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050914; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #chat-window { display: none; height: 400px; width: 300px; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-navy-900 text-white antialiased">
    <nav class="fixed w-full z-50 glass px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tighter">COUP<span class="text-energy">D'MAIN</span></div>
        <div class="hidden md:flex space-x-6 items-center">
            <a href="#" class="text-sm font-medium hover:text-energy transition">Espace Prestataire</a>
            <a href="#" class="text-sm font-medium hover:text-energy transition">Espace Partenaire</a>
            <a href="#" class="bg-energy text-navy-900 px-5 py-2 rounded-full font-bold hover:scale-105 transition transform">Espace Prospect</a>
        </div>
    </nav>

    <section class="pt-32 pb-20 px-6 text-center min-h-screen flex flex-col justify-center">
        <h1 class="text-5xl lg:text-7xl font-extrabold leading-tight mb-6">Votre <span class="text-energy">Mise en Relation</span> Haute Performance.</h1>
        <div class="flex flex-col sm:flex-row gap-4 justify-center mt-10 text-center">
            <button class="bg-energy text-navy-900 px-8 py-4 rounded-full font-bold text-lg hover:bg-yellow-300 transition">Accès Prospect</button>
            <button class="border border-white px-8 py-4 rounded-full font-semibold text-lg transition">Accès Prestataire</button>
            <button class="border border-gray-500 hover:border-white px-8 py-4 rounded-full font-semibold text-lg transition">Accès Partenaire</button>
        </div>
    </section>

    <div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
        <div id="chat-window" class="bg-navy-800 border border-energy rounded-2xl mb-4 flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-energy text-navy-900 p-3 font-bold text-sm">Assistant IA - Coup d'main</div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto text-sm space-y-2 text-left"></div>
            <div class="p-2 border-t border-gray-700 flex gap-2">
                <input id="chat-input" type="text" class="bg-navy-900 text-white text-xs p-2 rounded flex-1 focus:outline-none" placeholder="Posez votre question...">
                <button onclick="sendMessage()" class="bg-energy text-navy-900 text-xs px-3 py-1 rounded font-bold">OK</button>
            </div>
        </div>
        <button onclick="toggleChat()" class="bg-energy text-navy-900 w-16 h-16 rounded-full shadow-2xl flex items-center justify-center font-bold text-xl hover:scale-110 transition">IA</button>
    </div>

    <script>
        const API_KEY = "AIzaSyAY9tVu_o5i3i7Kkjp8f5cdAwLXjIVklUg";
        
        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-messages');
            if(!input.value) return;

            const userText = input.value;
            box.innerHTML += `<div class="text-energy font-bold text-xs">Vous:</div><div class="mb-2">${userText}</div>`;
            input.value = '';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }] })
                });
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                box.innerHTML += `<div class="text-blue-400 font-bold text-xs">IA:</div><div class="mb-4">${aiText}</div>`;
                box.scrollTop = box.scrollHeight;
            } catch (e) {
                box.innerHTML += `<div class="text-red-500">Erreur de connexion.</div>`;
            }
        }
    </script>
</body>
</html>
